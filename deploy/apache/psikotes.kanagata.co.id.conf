# Apache Reverse Proxy Configuration for psikotes.kanagata.co.id
# Lokasi di server: /etc/apache2/sites-available/psikotes.kanagata.co.id.conf

<VirtualHost *:80>
    ServerName psikotes.kanagata.co.id

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8086/
    ProxyPassReverse / http://127.0.0.1:8086/

    # Support WebSocket jika ada
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8086/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/psikotes_error.log
    CustomLog ${APACHE_LOG_DIR}/psikotes_access.log combined
</VirtualHost>
