# Nginx Reverse Proxy Configuration for psikotes.kanagata.co.id
# Lokasi di server: /etc/nginx/sites-available/psikotes.kanagata.co.id

server {
    listen 80;
    server_name psikotes.kanagata.co.id;

    # Forward traffic ke aplikasi Docker yang berjalan di port 8086
    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support WebSocket jika ada
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
