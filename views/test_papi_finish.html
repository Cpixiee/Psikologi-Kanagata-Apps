<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes PAPI - Selesai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .finish-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 3rem;
            max-width: 700px;
            width: 90%;
            text-align: center;
        }
        .success-icon {
            font-size: 6rem;
            color: #28a745;
            margin-bottom: 1.5rem;
            animation: scaleIn 0.5s ease;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .finish-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #28a745;
            margin-bottom: 1rem;
        }
        .finish-message {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 2rem 0;
        }
        .stat-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1.5rem;
        }
        .stat-box i {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 0.5rem;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }
        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }
        .btn-result {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .btn-result:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            color: white;
        }
    </style>
</head>
<body>
    <div class="finish-container">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        
        <h1 class="finish-title">Tes Selesai!</h1>
        <p class="finish-message">
            Selamat! Anda telah berhasil menyelesaikan tes PAPI.
            Jawaban Anda telah tersimpan.
        </p>
        
        <div class="stats-container">
            <div class="stat-box">
                <i class="fas fa-list-ol"></i>
                <div class="stat-value">{{.TotalItems}}</div>
                <div class="stat-label">Total Soal</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-clock"></i>
                <div class="stat-value">{{.TimeTaken}}</div>
                <div class="stat-label">Waktu Pengerjaan</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-check-double"></i>
                <div class="stat-value">{{.TotalItems}}</div>
                <div class="stat-label">Soal Dijawab</div>
            </div>
        </div>
        
        <a href="/test/papi/result" class="btn btn-result">
            <i class="fas fa-chart-bar me-2"></i>Lihat Hasil Tes
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
